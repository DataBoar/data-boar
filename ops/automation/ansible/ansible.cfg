# Used when running playbooks from this directory (e.g. on LAB-NODE-01).
# Matches scripts/lab-node-01-ansible-baseline.ps1 (ANSIBLE_ROLES_PATH=./roles).
[defaults]
roles_path = roles
collections_path = ./collections/ansible_collections:~/.ansible/collections:/usr/share/ansible/collections
# Single-host LAB-NODE-01 runs: avoid edge cases with parallel become prompts.
forks = 1
