---
# Snapper — BTRFS snapshot automation for LAB-NODE-01 lab node.
# IMPORTANT: snapper only works on btrfs subvolumes.
# This role skips gracefully if the filesystem is not btrfs.

# Enable/disable the role entirely.
lab_node_01_snapper_enabled: true

# Subvolume to protect (default: root — requires root on btrfs).
lab_node_01_snapper_config_name: "root"
lab_node_01_snapper_subvolume: "/"
# create-config autodetection uses setmntent(3) and can fail under Ansible ("setmntent failed").
# Forcing btrfs avoids that path on btrfs roots.
lab_node_01_snapper_create_config_fstype: "btrfs"

# Snapshot schedule (systemd timer — snapper ships timeline timers).
lab_node_01_snapper_timeline_create: true
lab_node_01_snapper_timeline_cleanup: true

# How many snapshots to keep in each category.
lab_node_01_snapper_timeline_limit_hourly:  "5"
lab_node_01_snapper_timeline_limit_daily:   "7"
lab_node_01_snapper_timeline_limit_weekly:  "2"
lab_node_01_snapper_timeline_limit_monthly: "2"
lab_node_01_snapper_timeline_limit_yearly:  "1"