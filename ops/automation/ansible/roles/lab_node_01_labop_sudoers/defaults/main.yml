---
# Opt-in: writing sudoers is sensitive; keep disabled by default.
lab_node_01_labop_sudoers_enable: false

# Include Maestro NFS/CIFS ensure scripts (LABOP_NFS_SERVER / LABOP_SMB_SERVER).
lab_node_01_labop_sudoers_maestro_targets: true

# Target sudoers include path.
lab_node_01_labop_sudoers_include_path: /etc/sudoers.d/labop-host-report

# User allowed to run the host report without a password.
lab_node_01_labop_sudoers_user: "{{ ansible_user | default('leitao') }}"

# Absolute repo path on the host (no ~ expansion in sudoers).
lab_node_01_labop_repo_path: "/home/{{ lab_node_01_labop_sudoers_user }}/Projects/dev/data-boar"

