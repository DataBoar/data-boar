---
# --- CLI tools ---
lab_node_01_obs_install_cli_tools: true
# ctop is not in apt; install via binary download.
# Upstream assets are named ctop-<version>-linux-<arch> (see https://github.com/bcicen/ctop/releases).
lab_node_01_obs_install_ctop: true
lab_node_01_obs_ctop_version: "0.7.7"
# Match release filename suffix: linux-amd64, linux-arm64, linux-arm, etc.
lab_node_01_obs_ctop_linux_arch: "amd64"

# --- Syslog forwarding ---
lab_node_01_obs_syslog_forward_enabled: false
# Set this to your Graylog/syslog server IP (keep real IPs in docs/private/).
lab_node_01_obs_syslog_server_ip: ""
lab_node_01_obs_syslog_port: 514
lab_node_01_obs_syslog_protocol: "udp"   # "udp" or "tcp"

# --- Munin node ---
lab_node_01_obs_munin_node_enabled: true
# List of IPs allowed to scrape munin-node (Munin master addresses).
lab_node_01_obs_munin_allowed_ips: []   # e.g. ["10.0.1.10"]

# --- Monit ---
lab_node_01_obs_monit_enabled: true
lab_node_01_obs_monit_web_enabled: false
lab_node_01_obs_monit_web_port: 2812
lab_node_01_obs_monit_web_user: "admin"
lab_node_01_obs_monit_web_password: "changeme_in_vault"

# --- Prometheus node_exporter ---
lab_node_01_obs_node_exporter_enabled: true
lab_node_01_obs_node_exporter_ufw_allow_from: "10.0.0.0/16"

# --- Wazuh agent ---
lab_node_01_obs_wazuh_agent_enabled: false
lab_node_01_obs_wazuh_manager_ip: ""   # real IP in docs/private/; do NOT commit
lab_node_01_obs_wazuh_version: "4"     # major version for apt repo
