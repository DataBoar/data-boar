version: 1
issue: 835
methodology:
  detector_tuple: sensitivity_level, pattern_detected, norm_tag, confidence 0-100
  classes:
  - pii
  - clean
  - tricky_fp
  - tricky_fn
  splits:
    measure: Final precision/recall/F1 publication. Do not reuse these templates for
      confidence calibration.
    calibrate: Reserved for confidence-threshold tuning only. Disjoint template_id
      family and synthetic identifiers (Presidio-research anti-leakage).
  anti_leakage: No template_id and no synthetic identifier may appear in both measure
    and calibrate splits.
template_families:
  measure:
    cpf: 529.982.247-25
    cnpj: 11.222.333/0001-81
    email: ana.souza@example-test.com
  calibrate:
    cpf: 390.533.447-05
    cnpj: 12.345.678/0001-95
    email: carlos.lima@demo.invalid
