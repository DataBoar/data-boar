# Pre-1.8.0 credential names (#2164 / upgrade smoke #2162).
# These names were valid in 1.7.x and must load in 1.8.x without rename.
targets:
  - name: pg-legacy
    type: database
    engine: postgresql
    host: db.example
    user: auditor
    pass_from_env: DATABOAR_PG_PASSWORD
    allowed_hosts: ["db.example"]
  - name: smb-legacy
    type: smb
    host: files.example
    share: docs
    user: auditor
    pass_from_env: MEU_BANCO_SENHA
    allowed_hosts: ["files.example"]
  - name: mongo-legacy
    type: mongodb
    host: mongo.example
    database: lab
    pass_from_env: DATABOAR_MONGO_PASS
    allowed_hosts: ["mongo.example"]
  - name: redis-legacy
    type: redis
    host: redis.example
    pass_from_env: DATABOAR_REDIS_PASS
    allowed_hosts: ["redis.example"]
report:
  output_dir: .
sqlite_path: audit_legacy_upgrade.db
api: {}
