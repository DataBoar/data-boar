# Pre-1.8.0 credential names (#2164 / upgrade smoke #2162).
# Typical 1.7.x config: unprefixed non-REST names, no allowed_hosts.
targets:
  - name: pg-legacy
    type: database
    engine: postgresql
    host: db.example
    user: auditor
    pass_from_env: DATABOAR_PG_PASSWORD
  - name: smb-legacy
    type: smb
    host: files.example
    share: docs
    user: auditor
    pass_from_env: MEU_BANCO_SENHA
  - name: mongo-legacy
    type: mongodb
    host: mongo.example
    database: lab
    pass_from_env: DATABOAR_MONGO_PASS
  - name: redis-legacy
    type: redis
    host: redis.example
    pass_from_env: DATABOAR_REDIS_PASS
report:
  output_dir: .
sqlite_path: audit_legacy_upgrade.db
api: {}