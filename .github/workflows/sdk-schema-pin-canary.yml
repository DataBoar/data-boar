# SDK schema pin canary — compares docs/sdk/*.schema.json pins to
# DataBoar/data-boar-sdk main (L1 metadata_manifest + L3 transformed_rows).
# Default CI (ci.yml) does NOT run this: no network.
# Fail means bump the pin after review, never emit a degraded document.
name: SDK schema pin canary

permissions:
  contents: read

'on':
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  pin-check:
    name: SDK schema pins vs SDK main
    runs-on: ubuntu-latest
    env:
      DATA_BOAR_SDK_SCHEMA_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compare pin to SDK default branch
        run: uv run pytest -v -W error tests/test_sdk_schema_pin.py
