# SDK schema pin canary — compares docs/sdk/metadata_manifest.schema.json to
# DataBoar/data-boar-sdk main. Default CI (ci.yml) does NOT run this: no network.
# Fail means bump the pin after review, never emit a degraded L1 document.
name: SDK schema pin canary

permissions:
  contents: read

'on':
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  pin-check:
    name: metadata_manifest pin vs SDK main
    runs-on: ubuntu-latest
    env:
      DATA_BOAR_SDK_SCHEMA_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compare pin to SDK default branch
        run: uv run pytest -v -W error tests/test_sdk_schema_pin.py
