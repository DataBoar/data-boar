# Keeps requirements.txt in sync when Dependabot updates uv.lock / pyproject.toml.
# Third-party Actions use full commit SHAs (tag in comment); bump via Dependabot (github-actions).
# Under required_signatures (#1419) this workflow never unsigned-pushes: handoff comment + artifact,
# or optional signed child PR when DEPENDABOT_SYNC_SSH_SIGNING_KEY is configured.
# Pwn-request hardening: trusted sync script from base ref; only lockfiles from PR head.
name: Dependabot requirements.txt sync

permissions:
  contents: read

# Quoted key: PyYAML 1.1 treats bare `on` as boolean true (see semgrep.yml).
'on':
  pull_request:
    branches: [main, master]
    paths:
      - "uv.lock"
      - "pyproject.toml"

concurrency:
  group: dependabot-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-requirements:
    name: Regenerate requirements.txt
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted sync script (base ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          sparse-checkout: scripts/ci_dependabot_requirements_sync.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout Dependabot dependency files only (untrusted head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: dependabot-input
          sparse-checkout: |
            uv.lock
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Sync requirements.txt (handoff or signed child PR)
        id: sync
        working-directory: dependabot-input
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPENDABOT_SYNC_WORKSPACE: ${{ github.workspace }}/dependabot-input
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEPENDABOT_SYNC_SSH_SIGNING_KEY: ${{ secrets.DEPENDABOT_SYNC_SSH_SIGNING_KEY }}
          DEPENDABOT_SYNC_SSH_ALLOWED_SIGNERS: ${{ secrets.DEPENDABOT_SYNC_SSH_ALLOWED_SIGNERS }}
          DEPENDABOT_SYNC_GIT_USER_NAME: ${{ vars.DEPENDABOT_SYNC_GIT_USER_NAME }}
          DEPENDABOT_SYNC_GIT_USER_EMAIL: ${{ vars.DEPENDABOT_SYNC_GIT_USER_EMAIL }}
        run: bash "${{ github.workspace }}/trusted/scripts/ci_dependabot_requirements_sync.sh"

      - name: Upload requirements.txt artifact (operator handoff)
        if: failure() && steps.sync.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-txt-pr-${{ github.event.pull_request.number }}
          path: dependabot-input/requirements.txt
          if-no-files-found: ignore

  slack-notify-on-failure:
    name: Slack CI failure notify
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [sync-requirements]
    uses: ./.github/workflows/slack-ci-failure-notify.yml
    with:
      run_name: Dependabot requirements.txt sync
      head_branch: ${{ github.head_ref || github.ref_name }}
      event: ${{ github.event_name }}
      html_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
