# Keeps requirements.txt in sync when Dependabot updates uv.lock / pyproject.toml.
# Third-party Actions use full commit SHAs (tag in comment); bump via Dependabot (github-actions).
# Under required_signatures (#1419) this workflow never unsigned-pushes: handoff comment + artifact,
# or optional signed child PR when DEPENDABOT_SYNC_SSH_SIGNING_KEY is configured.
name: Dependabot requirements.txt sync

permissions:
  contents: read
  pull-requests: write

# Quoted key: PyYAML 1.1 treats bare `on` as boolean true (see semgrep.yml).
'on':
  pull_request:
    branches: [main, master]
    paths:
      - "uv.lock"
      - "pyproject.toml"

concurrency:
  group: dependabot-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-requirements:
    name: Regenerate requirements.txt
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Sync requirements.txt (handoff or signed child PR)
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEPENDABOT_SYNC_SSH_SIGNING_KEY: ${{ secrets.DEPENDABOT_SYNC_SSH_SIGNING_KEY }}
          DEPENDABOT_SYNC_SSH_ALLOWED_SIGNERS: ${{ secrets.DEPENDABOT_SYNC_SSH_ALLOWED_SIGNERS }}
          DEPENDABOT_SYNC_GIT_USER_NAME: ${{ vars.DEPENDABOT_SYNC_GIT_USER_NAME }}
          DEPENDABOT_SYNC_GIT_USER_EMAIL: ${{ vars.DEPENDABOT_SYNC_GIT_USER_EMAIL }}
        run: bash scripts/ci_dependabot_requirements_sync.sh

      - name: Upload requirements.txt artifact (operator handoff)
        if: failure() && steps.sync.outcome == 'failure'
        uses: actions/upload-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: requirements-txt-pr-${{ github.event.pull_request.number }}
          path: requirements.txt
          if-no-files-found: ignore

  slack-notify-on-failure:
    name: Slack CI failure notify
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [sync-requirements]
    uses: ./.github/workflows/slack-ci-failure-notify.yml
    with:
      run_name: Dependabot requirements.txt sync
      head_branch: ${{ github.head_ref || github.ref_name }}
      event: ${{ github.event_name }}
      html_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
