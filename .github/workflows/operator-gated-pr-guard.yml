# Operator-gated PR merge guard (GitHub #1709). Brother of operator-gated-reopen.yml (#990).
#
# When the PR has label `operator-gated` OR the diff vs base touches GATE_FILES
# (imported from scripts/gate_change_tripwire.py — do not duplicate the list),
# this job FAILS unless the **latest** PR comment is Gate-Change-Approved-By
# plus a file-namespace SSHSIG verified by gate_trailer_attest.py.
#
# Do NOT trust GitHub actor identity (shared operator/agent account).
# Trailer text without SSHSIG is not approval. Do not swallow the verifier exit code.
#
# Operator (human): add this check as required on ruleset `main-gate-pii`.
name: Operator-gated PR attestation

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  guard-attestation:
    name: SSHSIG attestation when gated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=50

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Write latest PR comment only
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name).join(",");
            fs.writeFileSync("pr-labels.txt", labels);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 }
            );
            let latest = "";
            if (comments.length > 0) {
              const sorted = [...comments].sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              );
              latest = sorted[0].body || "";
            }
            fs.writeFileSync("pr-latest-comment.md", latest);

      - name: Enforce SSHSIG attestation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          LABELS="$(cat pr-labels.txt)"
          uv run python scripts/operator_gated_pr_guard.py \
            --base "origin/${BASE_REF}" \
            --labels "$LABELS" \
            --message-file pr-latest-comment.md
