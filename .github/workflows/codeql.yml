# CodeQL: security and quality analysis for Python (OWASP, injection, etc.).
# Results appear under Security > Code scanning; configure rulesets for merge protection.
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
# (verify: default-setup disabled 2026-08-25, this custom workflow is the sole CodeQL source of truth now, badge restored -- issue #1757)
#
# Actions pinned to full commit SHAs (tag in comment); bump via Dependabot or after upstream review.
#
# Explicit permissions satisfy GitHub's "Workflow does not contain permissions" requirement:
# - contents: read — checkout and read repo
# - security-events: write — upload CodeQL results to Security tab
# - actions: read — CodeQL action may need to read other actions
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly run (default branch) to catch new CodeQL findings
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # Keep broad default coverage for "just in case" findings.
          # Do not remove existing project hardening rules; this augments them.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
