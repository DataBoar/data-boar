# Install MariaDB client headers so the `mariadb` PyPI package can build from
# source on Ubuntu runners. Used by Linux jobs in ci.yml and sbom.yml.
#
# Composite-action steps cannot set `timeout-minutes` (workflow job steps only).
# Fail-fast for stalled apt mirrors is coreutils `timeout` around apt-get
# (GitHub's default job timeout is 6h — see #1627).
name: Install libmariadb-dev
description: >-
  Install apt packages (default libmariadb-dev and pkg-config) via apt with a bounded timeout so stalled
  mirrors fail the step instead of hanging the runner for hours (#1627). Restricts
  apt indexes to Ubuntu main+updates (#1862), retries transient stalls via apt
  Acquire::Retries (#1865) and lists both azure.archive.ubuntu.com and
  archive.ubuntu.com so one mirror or DNS outage does not fail the install (#2220).

inputs:
  packages:
    description: Space-separated apt packages to install (default keeps the original libmariadb-dev use).
    required: false
    default: libmariadb-dev pkg-config
  no-install-recommends:
    description: Pass --no-install-recommends to apt-get install ("true" or "false").
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: apt-get install (two Ubuntu mirrors, bounded, retried)
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        set -euo pipefail
        # Log the runner's native apt layout (ubuntu.sources / apt-mirrors.txt / sources.list)
        # for diagnosis; the sources actually used are written below (#2220).
        echo "apt layout (before the sources below):"
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          echo "  apt-mirrors.txt:"
          grep -E 'archive|azure' /etc/apt/apt-mirrors.txt || true
        fi
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          echo "  ubuntu.sources: deb822 present"
        fi
        if [ -f /etc/apt/sources.list ]; then
          grep -E 'archive|azure' /etc/apt/sources.list || true
        fi
        # #1862: apt-get update fetching noble+updates+backports+security plus
        # Microsoft/Google lists can exceed 240s on a slow canonical mirror.
        # Keep only Ubuntu main+updates (enough for libmariadb-dev / pkg-config);
        # disable the rest.
        . /etc/os-release
        # #2220: list BOTH mirrors, the runner's native one first. With a single host and no
        # fallback, `apt-get update` exits 0 with `W: Failed to fetch` when that host does not
        # resolve, and the install then dies with `E: Unable to locate package` (seen on main,
        # Ubuntu `resolute`, `Temporary failure resolving archive.ubuntu.com`). apt moves on to
        # the next source for each index, so one mirror/DNS outage no longer fails the job.
        : > /tmp/data-boar-mariadb.list
        for mirror in azure.archive.ubuntu.com archive.ubuntu.com; do
          printf 'deb http://%s/ubuntu/ %s main universe\n' \
            "${mirror}" "${VERSION_CODENAME}" >> /tmp/data-boar-mariadb.list
          printf 'deb http://%s/ubuntu/ %s-updates main universe\n' \
            "${mirror}" "${VERSION_CODENAME}" >> /tmp/data-boar-mariadb.list
        done
        sudo install -m 0644 /tmp/data-boar-mariadb.list /etc/apt/sources.list.d/data-boar-mariadb.list
        if [ -f /etc/apt/sources.list ]; then
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.disabled-1862
          echo "  disabled sources.list (#1862)"
        fi
        for f in /etc/apt/sources.list.d/*; do
          [ -e "$f" ] || continue
          base="$(basename "$f")"
          case "$base" in
            data-boar-mariadb.list|*.disabled-1862) ;;
            *)
              sudo mv "$f" "${f}.disabled-1862"
              echo "  disabled ${base} (#1862)"
              ;;
          esac
        done
        # #1865: apt-level retries for transient archive.ubuntu.com stalls that
        # survive the #1862 index shrink.
        apt_retry_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
        )
        # 420s wall clock per apt-get invocation (composite steps have no timeout-minutes).
        timeout 420 sudo apt-get "${apt_retry_opts[@]}" update
        install_opts=(-y)
        if [ "${NO_RECOMMENDS}" = "true" ]; then install_opts+=(--no-install-recommends); fi
        read -r -a pkgs <<< "${PACKAGES}"
        timeout 420 sudo apt-get "${apt_retry_opts[@]}" install "${install_opts[@]}" "${pkgs[@]}"
