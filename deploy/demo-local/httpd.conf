# Minimal read-only httpd for the local demo (#1447): WebDAV share under /dav
# and static JSON for the REST target under /api. Loopback publish only, no
# secrets, synthetic data. mod_dav is needed because WebDAV listing uses
# PROPFIND (plain nginx cannot serve it).
ServerRoot "/usr/local/apache2"
ServerName 127.0.0.1
Listen 8077
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
PidFile /tmp/httpd.pid
DAVLockDB /tmp/DavLock
ErrorLog /dev/stderr
LogLevel warn
ServerTokens Prod
DocumentRoot "/srv/web"
<Directory "/">
    Require all denied
</Directory>
Alias /dav /srv/web/dav
<Directory "/srv/web/dav">
    Dav On
    <RequireAny>
        Require method GET HEAD OPTIONS PROPFIND
    </RequireAny>
</Directory>
Alias /api /srv/web/api
<Directory "/srv/web/api">
    ForceType application/json
    <RequireAny>
        Require method GET HEAD OPTIONS
    </RequireAny>
</Directory>
