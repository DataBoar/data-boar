[package]
name = "boar_fast_filter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "boar_fast_filter"
crate-type = ["cdylib"]

[dependencies]
#pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
regex = "1.10"

[features]
# Default: one stable-ABI wheel (cp38-abi3) that loads on every GIL CPython >= 3.8.
# Free-threaded CPython (python3.14t) cannot load abi3 wheels (#2216): build that cell with
#   maturin build --release --no-default-features -i python3.14t
# which yields a per-interpreter cp314-cp314t wheel from this same manifest (no edited copy).
default = ["abi3"]
abi3 = ["pyo3/abi3-py38"]
