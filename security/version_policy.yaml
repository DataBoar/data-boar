# Release/version policy guardrails (ADR-0072/0073, GitHub #978).
# release_gate.open: false — #406 closed (1.7.4 / PR #1024); successor #2123 closed (1.8.0 GA train).
# open:false is the machine rule that allows a non-prerelease [project].version (test_release_version_policy).

release_gate:
  issue_number: 2123
  open: false

forbidden_version_literals:
  - "1.7.5-beta"
  - "v1.7.5-beta"
  - 'version = "1.7.5"'
  - "version = '1.7.5'"

# Paths where forbidden literals may appear (negation docs, policy, tests, ADR tombstones).
scan_allowlist_path_substrings:
  - "security/version_policy.yaml"
  - "tests/test_release_version_policy.py"
  - "docs/adr/ADR-0073"
  - "docs/adr/ADR-0061"
  - "docs/VERSIONING"
  - "CHANGELOG.md"
  - "AGENTS.md"
  - ".cursor/rules/release-versioning.mdc"
