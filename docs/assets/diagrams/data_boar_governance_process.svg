<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">ISO/IEC 27014 governance process and Data Boar evidence contribution</title><desc id="desc">Evaluate, Direct, Monitor, Communicate and Assure are governance processes. Data Boar supplies technical evidence to Monitor and supports communication, but does not make Evaluate or Direct decisions and does not provide independent assurance.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#43516a}.name{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#43516a}</style></defs><rect width="1200" height="620" rx="24" fill="#f7f9fc"/><text x="60" y="60" class="h">Information-security governance: process and evidence flow</text><text x="60" y="92" class="sub">ISO/IEC 27014 — Data Boar contributes evidence; it does not assume governance authority</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M260 250 H290 M490 250 H520 M720 250 H750 M950 250 H980"/></g><rect x="60" y="165" width="200" height="170" rx="16" fill="#e8eef8" stroke="#8ca4c8" stroke-width="2"/><text x="84" y="207" class="name">Evaluate</text><text x="84" y="243" class="body">Consider context,</text><text x="84" y="267" class="body">risk and outcomes</text><text x="84" y="308" class="small">Governance decision</text><rect x="290" y="165" width="200" height="170" rx="16" fill="#e9f3ef" stroke="#83aa98" stroke-width="2"/><text x="314" y="207" class="name">Direct</text><text x="314" y="243" class="body">Set priorities,</text><text x="314" y="267" class="body">policy and resources</text><text x="314" y="308" class="small">Governance decision</text><rect x="520" y="165" width="200" height="170" rx="16" fill="#fff0d9" stroke="#c28d4d" stroke-width="3"/><text x="544" y="207" class="name">Monitor</text><text x="544" y="243" class="body">Observe performance</text><text x="544" y="267" class="body">against objectives</text><text x="544" y="308" class="small">Data Boar contributes here</text><rect x="750" y="165" width="200" height="170" rx="16" fill="#eeeafa" stroke="#9c8ac7" stroke-width="2"/><text x="774" y="207" class="name">Communicate</text><text x="774" y="243" class="body">Share context and</text><text x="774" y="267" class="body">evidence with parties</text><text x="774" y="308" class="small">Supported by reports</text><rect x="980" y="165" width="160" height="170" rx="16" fill="#f5e9ec" stroke="#bd8b98" stroke-width="2"/><text x="1002" y="207" class="name">Assure</text><text x="1002" y="243" class="body">Independent</text><text x="1002" y="267" class="body">confidence</text><text x="1002" y="308" class="small">Not the scanner</text><rect x="520" y="390" width="430" height="145" rx="16" fill="#172033"/><text x="550" y="430" style="font:700 20px Inter,Arial,sans-serif;fill:#fff">Data Boar evidence outputs</text><text x="550" y="465" style="font:16px Inter,Arial,sans-serif;fill:#e2e8f0">Findings · coverage / failures · trends</text><text x="550" y="493" style="font:16px Inter,Arial,sans-serif;fill:#e2e8f0">Session manifest · audit trail · APG</text><text x="550" y="519" style="font:14px Inter,Arial,sans-serif;fill:#cbd5e1">Only for configured, supported, authorised targets</text><path d="M620 335 V390 M820 390 V350" stroke="#c28d4d" stroke-width="3" fill="none"/><path d="M610 380 L620 390 L630 380 M810 360 L820 350 L830 360" fill="none" stroke="#c28d4d" stroke-width="3"/><rect x="60" y="390" width="410" height="145" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="90" y="430" class="name">Human accountability</text><text x="90" y="465" class="body">Authorised scope · interpretation · risk acceptance</text><text x="90" y="493" class="body">Control ownership · remediation · assurance</text><text x="90" y="519" class="small">The organisation remains accountable</text><path d="M470 462 H520" stroke="#64748b" stroke-width="3" stroke-dasharray="6 6"/><text x="60" y="580" class="small">Conceptual diagram; not a reproduction of the ISO/IEC 27014 figure.</text></svg>