<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Data Boar in the data, IT and information-security governance layers</title><desc id="desc">Three complementary governance layers. Data governance inventories and classifies data; IT governance assigns objectives and decision rights; information-security governance evaluates, directs, monitors, communicates and assures. Data Boar contributes technical discovery evidence, mainly to monitoring, without taking governance decisions.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#43516a}.layer{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#43516a}.tag{font-size:16px;font-weight:700}</style></defs><rect width="1200" height="760" rx="24" fill="#f7f9fc"/><text x="60" y="62" class="h">Governance layers and the Data Boar contribution</text><text x="60" y="94" class="sub">A practical synthesis — frameworks remain complementary, not interchangeable</text><rect x="60" y="135" width="1080" height="140" rx="18" fill="#e8eef8" stroke="#8ca4c8" stroke-width="2"/><text x="92" y="178" class="layer">1 · Data governance — DAMA-DMBOK</text><text x="92" y="215" class="body">Inventory · classification · metadata · quality · lifecycle · security</text><rect x="785" y="163" width="315" height="76" rx="12" fill="#fff" stroke="#6d87b3" stroke-width="2"/><text x="805" y="193" class="tag">Data Boar discovery</text><text x="805" y="219" class="small">Configured, supported targets</text><rect x="60" y="300" width="1080" height="140" rx="18" fill="#e9f3ef" stroke="#83aa98" stroke-width="2"/><text x="92" y="343" class="layer">2 · IT governance and management — COBIT 2019</text><text x="92" y="380" class="body">Stakeholder needs · goals cascade · decision rights · governance EDM · management APO / BAI / DSS / MEA</text><rect x="785" y="390" width="315" height="34" rx="9" fill="#fff" stroke="#83aa98"/><text x="802" y="413" class="small">ADRs record product decisions</text><rect x="60" y="465" width="1080" height="140" rx="18" fill="#f7efe5" stroke="#c7a57d" stroke-width="2"/><text x="92" y="508" class="layer">3 · Information-security governance — ISO/IEC 27014</text><text x="92" y="545" class="body">Evaluate · Direct · Monitor · Communicate · Assure</text><rect x="785" y="528" width="315" height="58" rx="12" fill="#fff" stroke="#c28d4d" stroke-width="2"/><text x="805" y="553" class="tag">Primary contribution: Monitor</text><text x="805" y="574" class="small">Reports · trends · manifests · APG</text><path d="M470 275 V300 M470 440 V465" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7"/><path d="M460 291 L470 301 L480 291 M460 456 L470 466 L480 456" fill="none" stroke="#64748b" stroke-width="3"/><rect x="60" y="635" width="1080" height="76" rx="14" fill="#172033"/><text x="88" y="666" style="font:700 18px Inter,Arial,sans-serif;fill:#fff">Accountability stays with the organisation</text><text x="88" y="692" style="font:15px Inter,Arial,sans-serif;fill:#e2e8f0">Data Boar supplies evidence; leadership decides, management acts, and independent assurance remains separate.</text></svg>