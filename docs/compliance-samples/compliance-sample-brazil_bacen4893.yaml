# Brazil — BACEN Resolução 4893/2021
# Política de Segurança Cibernética para Bancos, Fintechs e Instituições de Pagamento
# In force: 1 February 2022 (full compliance deadline; Res. 4658/2018 consolidated and updated)
#
# NOT LEGAL ADVICE. Technical starting point for inventory of data fields relevant
# to cybersecurity and data governance obligations for Brazilian financial institutions.
# BACEN 4893 complements LGPD: financial institutions must comply with BOTH.
# Does NOT certify compliance with BACEN, LGPD, or Febraban norms.
#
# Authority: Banco Central do Brasil (BACEN)
# Reference: Resolução BCB 4.893/2021 — bcb.gov.br
# Scope: Banks (commercial, multiple, investment), payment institutions, fintechs,
#        direct credit companies (SCD/SEP), credit fintechs, and electronic money issuers.
#
# Key obligations: designated CISO, incident response plan, 3-tier cloud outsourcing rules,
# mandatory incident notification to BACEN within 4 business days, annual security policy review.
#
# Pair with: compliance-sample-lgpd.yaml for full Brazilian data governance coverage.
# Also relevant: compliance-sample-pci_dss.yaml for card data.
# NIS2 / DORA are evidence/inventory frameworks, not PII sample packs
# (see COMPLIANCE_FRAMEWORKS.md — cyber/AI governance as evidence, not samples).
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-brazil_bacen4893.yaml
#   ml_patterns_file:     path/to/compliance-sample-brazil_bacen4893.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.
#
# NOTE — ISPB (8 digits): a bare \b\d{8}\b matches sequential IDs and zip-like
# counters (same FP class as ABA routing). This sample requires an ISPB / SPI
# keyword near the digits. Do not loosen to bare 8-digit matching.

regex:
  # --- Brazilian financial identifiers ---
  - name: "BACEN_CONTA_CORRENTE"
    # Bank account number pattern (agência + conta) — heuristic
    pattern: "(?i)\\b(?:conta[_\\s]?(?:corrente|poupanca|pagamento)|account[_\\s]?number)[_\\s]?[:\\-]?\\s*\\d{4,12}\\b"
    norm_tag: "BACEN 4893 (dado financeiro — conta)"

  - name: "BACEN_AGENCIA"
    pattern: "(?i)\\b(agencia|agência|ag[\\.]?)[_\\s]?[:\\-]?\\s*\\d{4}\\b"
    norm_tag: "BACEN 4893 (dado financeiro — agência)"

  - name: "BACEN_CHAVE_PIX"
    # Pix key types: CPF, CNPJ, phone, email, random key (EVP)
    # Random key: 32-char UUID-like string
    pattern: "(?i)\\b(chave[_\\s]?pix|pix[_\\s]?key|chave[_\\s]?aleatoria|evp[_\\s]?pix)\\b"
    norm_tag: "BACEN 4893 (dado financeiro — chave Pix)"

  - name: "BACEN_CARTAO_FIELD"
    pattern: "(?i)\\b(numero[_\\s]?cartao|card[_\\s]?number|pan[_\\s]?masked|bin[_\\s]?number|cvv|cvc|expiry[_\\s]?date|validade[_\\s]?cartao)\\b"
    norm_tag: "BACEN 4893 (dado financeiro — cartão)"

  - name: "BACEN_TOKEN_PAGAMENTO"
    pattern: "(?i)\\b(token[_\\s]?pagamento|payment[_\\s]?token|network[_\\s]?token|wallet[_\\s]?token|tokenized[_\\s]?pan)\\b"
    norm_tag: "BACEN 4893 (dado financeiro — token)"

  - name: "BACEN_INCIDENT_FIELD"
    pattern: "(?i)\\b(incidente[_\\s]?cibernetico|cyber[_\\s]?incident[_\\s]?id|notificacao[_\\s]?bacen|relatorio[_\\s]?incidente|security[_\\s]?event[_\\s]?id)\\b"
    norm_tag: "BACEN 4893 Art. 11 (notificação incidente)"

  - name: "BACEN_OUTSOURCING_FIELD"
    pattern: "(?i)\\b(prestador[_\\s]?servico[_\\s]?ti|outsourcing[_\\s]?assessment|contrato[_\\s]?nuvem|cloud[_\\s]?provider[_\\s]?tier|terceirizacao[_\\s]?critica)\\b"
    norm_tag: "BACEN 4893 Art. 16 (terceirização)"

  - name: "BACEN_CRYPT_KEY_FIELD"
    pattern: "(?i)\\b(chave[_\\s]?criptografica|encryption[_\\s]?key[_\\s]?id|kms[_\\s]?key|hsm[_\\s]?key|master[_\\s]?key[_\\s]?ref)\\b"
    norm_tag: "BACEN 4893 (controle criptográfico)"

  # Brazilian financial identifiers (precise — keyword + digits; not bare 8-digit)
  - name: "BACEN_ISPB"
    # ISPB — Identificador de Sistema de Pagamentos Brasileiro (8 digits)
    pattern: "(?i)\\b(?:ispb|identificador[_\\s]?sistema[_\\s]?pagamentos)[_\\s]?[:\\-]?\\s*\\d{8}\\b"
    norm_tag: "BACEN 4893 (identificador financeiro — ISPB)"

  - name: "BACEN_NSU"
    # NSU — Número Sequencial Único de transação (up to 12 digits)
    pattern: "(?i)\\b(nsu|numero[_\\s]?sequencial[_\\s]?unico)[_\\s]?[:\\-]?\\s*\\d{6,12}\\b"
    norm_tag: "BACEN 4893 (dado de transação — NSU)"

