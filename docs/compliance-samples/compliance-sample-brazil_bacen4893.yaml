recommendation_overrides:
  - norm_tag_pattern: "BACEN 4893 (dado financeiro — chave Pix)"
    base_legal: "Resolução BCB 4.893/2021 + LGPD Art. 5 — chave Pix é dado pessoal associado a CPF, CNPJ, telefone ou e-mail. Tratamento exige base legal LGPD e conformidade com regulamentação BACEN/PIX. Autoridade: Banco Central do Brasil."
    risk: "Chave Pix vincula dados pessoais do titular a conta de pagamento. Exposição não autorizada pode facilitar fraudes, social engineering, ou violação de privacidade financeira. LGPD + BACEN 4893 aplicáveis."
    recommendation: "Verificar base legal LGPD para armazenamento de chaves Pix. Aplicar criptografia em repouso. Limitar acesso a sistemas de pagamento. Reportar incidentes ao BACEN (Art. 11, prazo 4 dias úteis). Consultar DPO e equipe jurídica."
    priority: "ALTA"
    relevant_for: "DPO, CISO, equipe de pagamentos, jurídico, BACEN compliance"

  - norm_tag_pattern: "BACEN 4893 (dado financeiro — cartão)"
    base_legal: "Resolução BCB 4.893/2021 + PCI-DSS + LGPD Art. 5 — dados de cartão são dados pessoais financeiros sujeitos a múltiplos frameworks. BACEN exige políticas de segurança cibernética para proteção desses dados."
    risk: "Dados de cartão (PAN, CVV, data de validade) são alvo primário de fraude financeira. Armazenamento inadequado viola PCI-DSS e exige notificação obrigatória ao BACEN em caso de incidente. CVV nunca deve ser armazenado."
    recommendation: "CVV/CVC NÃO deve ser armazenado após autorização (PCI-DSS req. 3.2). Tokenizar PAN. Verificar conformidade PCI-DSS. Usar compliance-sample-pci_dss.yaml em conjunto. Reportar incidente ao BACEN (prazo 4 dias úteis) e bandeiras (Visa/Mastercard). Consultar CISO e jurídico."
    priority: "CRÍTICA"
    relevant_for: "CISO, DPO, equipe de pagamentos, PCI-DSS QSA, jurídico"

  - norm_tag_pattern: "BACEN 4893 (dado financeiro — conta)"
    base_legal: "Resolução BCB 4.893/2021 + LGPD Art. 5 — dados de conta corrente/poupança/pagamento são dados pessoais financeiros. Sigilo bancário (LC 105/2001) aplicável."
    risk: "Dados de conta bancária sujeitos ao sigilo bancário (Lei Complementar 105/2001) além da LGPD. Vazamento pode gerar responsabilidade civil e criminal. BACEN exige controles de acesso e políticas de segurança cibernética."
    recommendation: "Aplicar criptografia em trânsito e repouso. Restringir acesso por necessidade de negócio. Manter logs de acesso auditáveis. Verificar sigilo bancário e LGPD. Consultar DPO, CISO e jurídico."
    priority: "ALTA"
    relevant_for: "DPO, CISO, jurídico, operações bancárias, BACEN compliance"

  - norm_tag_pattern: "BACEN 4893 Art. 11 (notificação incidente)"
    base_legal: "Resolução BCB 4.893/2021 Art. 11 — incidentes relevantes de segurança cibernética devem ser notificados ao BACEN em até 4 dias úteis. Autoridade: Banco Central do Brasil."
    risk: "Campo de tracking de incidente cibernético identificado. BACEN 4893 Art. 11 exige notificação em 4 dias úteis para incidentes relevantes. Atraso na notificação pode resultar em sanções do BACEN."
    recommendation: "Verificar se o incidente está sendo adequadamente tratado e notificado ao BACEN (quando aplicável). Confirmar se o plano de resposta a incidentes (Art. 6-8) está ativado. Consultar CISO e compliance BACEN. Não é conclusão legal."
    priority: "CRÍTICA"
    relevant_for: "CISO, DPO, jurídico, BACEN compliance, alta administração"

  - norm_tag_pattern: "BACEN 4893 Art. 16 (terceirização)"
    base_legal: "Resolução BCB 4.893/2021 Art. 16 — prestação de serviços relevantes de tecnologia da informação por terceiros exige contrato com cláusulas de segurança cibernética e avaliação de risco. Autoridade: BACEN."
    risk: "Dado de avaliação de terceirização ou contrato de nuvem identificado. BACEN 4893 exige que contratos com prestadores críticos incluam requisitos de segurança cibernética, direitos de auditoria e planos de contingência."
    recommendation: "Verificar se os contratos com prestadores de TI críticos incluem: (1) requisitos de segurança cibernética; (2) direitos de auditoria; (3) plano de contingência. Classificar prestadores por criticidade (Art. 16). Consultar jurídico e CISO."
    priority: "ALTA"
    relevant_for: "CISO, jurídico, procurement, BACEN compliance, gestão de fornecedores"

  - norm_tag_pattern: "BACEN 4893 (dado financeiro — token)"
    base_legal: "Resolução BCB 4.893/2021 + PCI-DSS — tokens de pagamento são dados financeiros sensíveis. Tokenização é uma medida de segurança exigida; o token não reduz obrigações de segurança para os sistemas que os gerenciam."
    risk: "Token de pagamento identificado. Embora tokens substituam dados de cartão bruto, os sistemas que gerenciam tokens são alvos de alto valor e exigem controles equivalentes aos dos dados originais sob PCI-DSS e BACEN 4893."
    recommendation: "Verificar isolamento do ambiente de tokenização. Aplicar controles PCI-DSS ao vault de tokens. Usar compliance-sample-pci_dss.yaml em conjunto. Consultar CISO e equipe de pagamentos."
    priority: "ALTA"
    relevant_for: "CISO, equipe de pagamentos, PCI-DSS QSA, DPO"

  - norm_tag_pattern: "BACEN 4893 (controle criptográfico)"
    base_legal: "Resolução BCB 4.893/2021 Art. 6 — política de segurança cibernética deve incluir controles criptográficos para proteção de dados em trânsito e em repouso. Autoridade: BACEN."
    risk: "Referência a chave criptográfica identificada. Gestão inadequada de chaves é um risco crítico sob BACEN 4893. Chaves expostas em databases ou filesystems representam falha de controle de segurança."
    recommendation: "Chaves criptográficas NÃO devem ser armazenadas em databases de aplicação ou filesystems sem proteção de HSM/KMS. Verificar política de gestão de chaves (ciclo de vida, rotação, custódia). Consultar CISO. Rotacionar qualquer chave exposta imediatamente."
    priority: "CRÍTICA"
    relevant_for: "CISO, equipe de segurança, DevSecOps, BACEN compliance"

  - norm_tag_pattern: "BACEN 4893 (dado de transação — NSU)"
    base_legal: "Resolução BCB 4.893/2021 + LGPD Art. 5 — NSU e dados de transação são dados pessoais financeiros sujeitos a sigilo bancário (LC 105/2001) e LGPD."
    risk: "NSU (Número Sequencial Único) de transação identifica operações financeiras específicas. Em conjunto com outros dados, permite reidentificação do titular e reconstrução de histórico financeiro."
    recommendation: "Limitar acesso a dados de NSU/transação. Verificar retenção mínima necessária. Aplicar pseudonimização quando histórico completo não for necessário. Consultar DPO e jurídico (sigilo bancário LC 105/2001 + LGPD)."
    priority: "ALTA"
    relevant_for: "DPO, CISO, jurídico, operações de pagamento"
