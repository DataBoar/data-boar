recommendation_overrides:
  # Health before a joined biometric/geo tag is unlikely to collide with
  # identity-number; keep highly-sensitive roles before identity.
  - norm_tag_pattern: "Israel PPL Amd.13 (highly sensitive — health)"
    base_legal: "Israel PPL 5741-1981 as amended by Amendment 13 (5784-2024, in force 14 Aug 2025) — health / medical data is Highly Sensitive Information. Large health bases (hospitals / HMOs) often face heightened security expectations. PPA notice may apply at 100k+ highly-sensitive subjects."
    risk: "Health records are a statutory highly-sensitive category. Unauthorized exposure can harm the data subject and trigger PPA scrutiny."
    recommendation: "Verify a lawful basis and security controls (encryption, access logs). Confirm whether PPA notification or a Privacy Protection Officer applies. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Israel PPL Amd.13 (highly sensitive — biometric)"
    base_legal: "Israel PPL Amendment 13 — biometric data is Highly Sensitive Information."
    risk: "Biometric templates are hard to rotate if leaked."
    recommendation: "Minimize biometric storage. Confirm purpose limitation and security controls. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Israel PPL Amd.13 (highly sensitive — genetic)"
    base_legal: "Israel PPL Amendment 13 — genetic data is Highly Sensitive Information."
    risk: "Genetic data can reveal health and kinship beyond the data subject."
    recommendation: "Restrict access and purpose. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Israel PPL Amd.13 (highly sensitive — geolocation)"
    base_legal: "Israel PPL Amendment 13 — location / traffic data is commonly treated as Highly Sensitive Information."
    risk: "Precise coordinates can track the data subject."
    recommendation: "Minimize stored location precision. Consult counsel. Heuristic inventory — not a legal conclusion."
    priority: "MÉDIA"
    relevant_for: "DPO, product, legal"

  - norm_tag_pattern: "Israel PPL Amd.13 (personal data — identity number)"
    base_legal: "Israel PPL 5741-1981 as amended by Amendment 13 — a teudat zehut / מספר זהות identifies a natural person. A bare 9-digit matcher is intentionally omitted (high false-positive rate)."
    risk: "Israeli identity-number fields identify the data subject."
    recommendation: "Minimize ID storage. Confirm Controller/Processor roles and any PPA notice duty. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, operations"
