# Israel — Privacy Protection Law 5741-1981 as amended by Amendment 13 (5784-2024)
# Knesset approved 5 Aug 2024; in force 14 Aug 2025.
#
# NOT LEGAL ADVICE. Technical starting point for inventory. Does NOT certify
# PPA registration, PPO appointment, or the 100k highly-sensitive notice.
#
# Authority: Privacy Protection Authority (PPA / רשות הגנת הפרטיות).
# Amendment 13 aligns roles to Controller / Processor (was database holder).
# Hebrew terms for those new statutory roles are omitted on purpose —
# native legal review is recommended before adding them as production terms.
# No Aramaic: not an administrative language for Israeli PII fields.
#
# Highly Sensitive Information (replaces the older "sensitive information"
# label) includes, among counsel summaries: health/medical, genetic,
# biometric, criminal records, geolocation / traffic, sexual orientation,
# political opinion, religion, ethnicity, personality assessment,
# salary / financial activity. Health databases (hospitals / HMOs) are a
# common high-risk inventory slice — encryption, access logs, and security
# testing are often discussed for large health bases; confirm current PPA
# guidance.
#
# Controllers of databases with highly sensitive information on 100,000+
# individuals generally must notify the PPA (identity, contact, PPO if
# required, database-definition document). Database registration was
# narrowed; do not treat "registrar" as the whole Amendment 13 story.
# Civil remedies without proving harm; limitation period commonly cited
# as extended from 2 to 7 years — revalidate the statute text.
#
# Identifiers use contextual column labels. No bare 9-digit matcher
# (Israeli ID / teudat zehut is 9 digits — high FP). No querystring
# geo-coordinate key (PII seed gate).
#
# Hebrew terms below are everyday inventory vocabulary, not a certified
# legal glossary.
#
# NOTE — recommendation_overrides use distinctive Amd.13 (role) patterns.
# Do not add a bare "Israel PPL" catch-all: _find_override_row is bidirectional.
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-israel_ppl.yaml
#   ml_patterns_file:     path/to/compliance-sample-israel_ppl.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.

regex:
  - name: "IL_FIELD_TEUDAT_ZEHUT_LABEL"
    pattern: "(?i)(?:^|_|\b)(teudat[_\\s]?zehut|mispar[_\\s]?zehut|israel(?:i)?[_\\s]?(?:national[_\\s]?)?id|israeli[_\\s]?id)\\w*"
    norm_tag: "Israel PPL Amd.13 (personal data — identity number)"

  - name: "IL_FIELD_HEALTH_LABEL"
    pattern: "(?i)(?:^|_|\b)(health[_\\s]?data[_\\s]?il|medical[_\\s]?(?:record|information)[_\\s]?il|patient[_\\s]?record[_\\s]?il)\\w*"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — health)"

  - name: "IL_FIELD_HEALTH_GENERIC_LABEL"
    pattern: "(?i)(?:^|_|\b)(medical[_\\s]?record|patient[_\\s]?record|health[_\\s]?data|mi[_\\s]?da[_\\s]?refui)\\w*"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — health)"

  - name: "IL_FIELD_BIOMETRIC_LABEL"
    pattern: "(?i)(?:^|_|\b)(biometric[_\\s]?(?:data|template)|fingerprint[_\\s]?il|face[_\\s]?print[_\\s]?il|netunim[_\\s]?biyometri)\\w*"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — biometric)"

  - name: "IL_FIELD_GENETIC_LABEL"
    pattern: "(?i)(?:^|_|\b)(genetic[_\\s]?(?:data|profile)|dna[_\\s]?(?:profile|data)[_\\s]?il|netunim[_\\s]?geneti)\\w*"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — genetic)"

  - name: "IL_PPL_JSON_LAT_PRECISION"
    pattern: "(?i)[\"']lat[\"']\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\b"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — geolocation)"

  - name: "IL_PPL_JSON_LNG_PRECISION"
    pattern: "(?i)[\"'](?:lng|lon)[\"']\\s*:\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}\\b"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — geolocation)"

  - name: "IL_PPL_LOCATION_CSV_PAIR"
    pattern: "(?i)\\blocation\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\s*,\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}"
    norm_tag: "Israel PPL Amd.13 (highly sensitive — geolocation)"

