recommendation_overrides:
  - norm_tag_pattern: "CMMC CUI"
    base_legal: "US CUI Program (NARA; 32 CFR Part 2002 framing); CMMC programme context and DFARS safeguarding expectations as cited by the organisation — technical inventory only."
    risk: "CUI markings, category labels, or dissemination controls (e.g. CUI//… banners, NOFORN, REL TO) — inventory signals that Controlled Unclassified Information vocabulary may be present in configured sources. Does not determine whether information is CUI, whether a marking is valid, or whether CMMC obligations apply."
    recommendation: "Treat findings as a catalog of where CUI-related markings and vocabulary concentrate; map to information owners and contract flow-downs with counsel; use for evidence packs and remediation prioritisation. Data Boar does not certify CMMC, assess a CMMC level, or replace a C3PAO / assessor engagement."
    priority: "ALTA"
    relevant_for: "CUI Program Manager, ISSM, Contracts, Legal, DPO, Defense supply-chain compliance"
  - norm_tag_pattern: "ITAR/EAR"
    base_legal: "US export-control vocabulary (ITAR / EAR / USML / CCL) as it appears in text — triage signals only; not a jurisdiction or licensing determination."
    risk: "Export-control labels or phrases (ITAR, EAR, USML, CCL, EAR99, export-controlled) — inventory signals for possible controlled technical data or related artefacts. Does not determine ITAR/EAR applicability, license requirements, or exportability."
    recommendation: "Escalate hits to export-compliance / counsel for classification review; document locations for access control and retention. Do not treat scanner tags as an export determination."
    priority: "ALTA"
    relevant_for: "Export Compliance Officer, Legal, Engineering, Contracts, ISSM"
