# PCI-DSS – sample compliance profile (Payment Card Industry Data Security Standard)
#
# Target audience: Merchants and assessors; payment card data scanning. Bundles patterns
# and recommendations so reports speak PCI-DSS language (scope, tokenization, cardholder data).
#
# How to use:
#   1. Set in your main config:
#        regex_overrides_file: path/to/compliance-sample-pci_dss.yaml
#        ml_patterns_file: path/to/compliance-sample-pci_dss.yaml
#   2. Merge the recommendation_overrides list below into your config under report.recommendation_overrides.
#
# Built-in detector already includes CREDIT_CARD; this sample adds norm_tag PCI-DSS and
# recommendation text for assessors. Optional: add PAN, CVV, track data patterns if needed.
#
# NOTE — financial routing / ABA routing number regex (NOT included here by default):
#   If you add a custom routing-number pattern (e.g. ABA 9-digit: \b\d{9}\b or
#   \b[0-9]{4}[0-9]{4}[0-9]\b with routing-transit framing), be aware that bare 9-digit
#   sequences produce very high FALSE POSITIVE rates against sequential IDs, ZIP+4 codes,
#   UUIDs, and other counters. To reduce FP risk:
#     a) Require structural context in the regex (e.g. near "routing", "ABA", "RTN", slash notation).
#     b) Pair the pattern with a keyword trigger (column name matches "routing" or "aba").
#     c) Test against a column with known non-PAN sequential data before enabling in production.
#   See SENSITIVITY_DETECTION.md §Custom regex patterns for guidance on scoping patterns.

regex:
  - name: "PAN"
    pattern: "\\b\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}[-\\s]?\\d{4}\\b"
    norm_tag: "PCI-DSS"
  - name: "CARD_TRACK_ALT"
    pattern: "\\b%?[B]?\\d{13,19}\\^[^\\^]+\\^\\d{4}"
    norm_tag: "PCI-DSS"
  # Field-validated column headers (#1318): tokenized metadata, PAN columns, CVV, expiry, track.
  # Use (?:^|_) so prefixed columns match (e.g. billing_card_number) without mid-word hits.
  - name: "PCI_CARD_COLUMN"
    pattern: "(?i)(?:^|_)(?:pan\\w*|card_?number\\w*|numero_?(?:do_?)?cart[aã]o\\w*|credit_?card\\w*|payment_?card\\w*|cardholder\\w*|titular_?(?:cart[aã]o|card)?\\w*|nome_?titular\\w*|bandeira\\w*)"
    norm_tag: "PCI-DSS Req. 3 (PAN / cardholder data column)"
  - name: "PCI_CVV"
    pattern: "(?i)(?:^|_)(?:cvv\\w*|cvc\\w*|card_?security_?code\\w*|codigo_?seguranca\\w*)"
    norm_tag: "PCI-DSS Req. 3.2 (CVV/CVC — never store)"
  - name: "PCI_CARD_EXPIRY"
    pattern: "(?i)(?:^|_)(?:card_?expir(?:y|ation)?\\w*|expir(?:y|ation)_?date\\w*|validade_?(?:cart[aã]o|card)?\\w*|data_?validade\\w*)"
    norm_tag: "PCI-DSS Req. 3 (card expiry — SAD if full track)"
  - name: "PCI_TRACK2"
    pattern: "(?i)(?:^|_)(?:track_?2\\w*|track_?ii\\w*|magnetic_?stripe\\w*|faixa_?magnetica\\w*)"
    norm_tag: "PCI-DSS Req. 3 (track data — prohibited storage)"
  - name: "PCI_TOKENIZED_METADATA"
    pattern: "(?i)(?:^|_)(?:last_?(?:four|4)(?:_digits)?\\w*|gateway_?token\\w*|payment_?token\\w*|card_?token\\w*|tokenized_?(?:pan|card)\\w*)"
    norm_tag: "PCI-DSS (scope reduction — tokenized metadata only)"

