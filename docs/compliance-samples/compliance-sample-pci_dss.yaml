recommendation_overrides:
  - norm_tag_pattern: "PCI-DSS Req. 3 (PAN / cardholder data column)"
    base_legal: "PCI-DSS Requirement 3 — protect stored cardholder data (PAN, cardholder name)."
    risk: "Column name indicates primary account number or cardholder data. Raw PAN storage expands PCI scope and breach impact."
    recommendation: "Confirm whether full PAN is stored. If yes: encrypt, restrict access, document retention, and scope for QSA/ISA. Prefer tokenization or point-to-point encryption to reduce scope."
    priority: "ALTA"
    relevant_for: "QSA, ISA, Security, Compliance, DBA"
  - norm_tag_pattern: "PCI-DSS Req. 3.2 (CVV/CVC"
    base_legal: "PCI-DSS Requirement 3.2 — sensitive authentication data must not be stored after authorization."
    risk: "CVV/CVC must never be stored post-authorization. Storage is a critical PCI violation."
    recommendation: "Remove CVV/CVC from storage immediately. Verify no historical backups retain SAD. Document compensating controls only with QSA approval — do not store CVV."
    priority: "CRÍTICA"
    relevant_for: "QSA, ISA, Security, Compliance, DBA"
  - norm_tag_pattern: "PCI-DSS Req. 3 (track data"
    base_legal: "PCI-DSS Requirement 3 — track data (magnetic stripe equivalent) is prohibited storage."
    risk: "Track data storage is a critical finding; full card data exposure risk."
    recommendation: "Eliminate track data from databases and logs. Validate tokenization scope with assessors."
    priority: "CRÍTICA"
    relevant_for: "QSA, ISA, Security, Compliance"
  - norm_tag_pattern: "scope reduction — tokenized"
    base_legal: "PCI-DSS — tokenization / scope reduction (metadata only: last four, payment token)."
    risk: "Column suggests tokenized card metadata rather than full PAN — positive control signal when no SAD is present."
    recommendation: "Praise / existing controls: tokenization reduces PCI scope. Confirm with gateway documentation that no full PAN, CVV, or track data is stored alongside these fields."
    priority: "INFORMATIVO"
    relevant_for: "QSA, ISA, Security, Compliance, DBA"
  - norm_tag_pattern: "PCI-DSS"
    base_legal: "PCI-DSS; cardholder data (CHD) scope"
    risk: "Storage or processing of cardholder data; scope for PCI-DSS assessment."
    recommendation: "Restrict storage of PAN/CVV; use tokenization or approved methods; ensure scope is documented for assessors."
    priority: "CRÍTICA"
    relevant_for: "QSA, ISA, Security, Compliance"
