# Peru — Ley 29733 (Protección de Datos Personales)
# Published 2011; reglamento DS 003-2013-JUS (2013). Revalidate the current
# reglamento consolidation before relying on secondary-rule citations.
#
# NOT LEGAL ADVICE. Technical starting point for inventory of personal-data
# fields. Does NOT certify compliance, ANPDP registration, or OECD alignment.
#
# Authority: Autoridad Nacional de Protección de Datos Personales (ANPDP) —
# Ley 29733 Art. 32 (Ministerio de Justicia). Registro Nacional / inscripción
# of bancos de datos: Art. 29 and Art. 34.
#
# OECD: Peru is an OECD accession candidate (roadmap adopted June 2022).
# It is NOT an OECD member as of 2026-08. Do not treat tags as "OECD 2024".
#
# Official Art. 2.5 sensitive list (not GDPR mirroring): biometric data that
# identifies the holder; racial and ethnic origin; ingresos económicos;
# political, religious, philosophical or moral opinions/convictions; union
# affiliation; health and sexual life.
#
# Art. 12 = interpretive value of the guiding principles — NOT consent.
# Consent: Art. 13.5 (prior, informed, express, unequivocal). Sensitive data:
# Art. 13.6 additionally requires written consent (or a statutory public-
# interest exception). Children/adolescents: Art. 13.3 (special measures via
# reglamento; rights via legal representatives).
#
# Art. 17 = confidentiality DUTY on controllers/processors — not a separate
# Art. 2.5 category named "comunicación confidencial". Ley 27806 Art. 17(5)
# confidential public-information types are treated as sensitive by a
# complementary provision — inventory only.
#
# Identifiers use contextual column labels. No bare 8-digit DNI, no nude
# 10/20 + 9-digit RUC, no letter+8 passport, no 9xxxxxxxx phone matcher
# (high FP; same class as nude CPF / ISPB). No querystring geo-coordinate
# key used in older samples (PII seed gate).
#
# Pair with: compliance-sample-ecuador_lopdp.yaml,
# compliance-sample-colombia_1581.yaml.
#
# NOTE — recommendation_overrides use distinctive Art. N.n (role) patterns.
# Do not add a bare "Ley 29733" catch-all: _find_override_row is bidirectional.
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-peru_ley29733.yaml
#   ml_patterns_file:     path/to/compliance-sample-peru_ley29733.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.

regex:
  - name: "PE_FIELD_DNI_LABEL"
    pattern: "(?i)(?:^|_|\b)(numero[_\\s]?(?:de[_\\s]?)?dni|dni[_\\s]?peru|documento[_\\s]?nacional[_\\s]?(?:de[_\\s]?)?identidad)\\w*"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — DNI)"

  - name: "PE_FIELD_RUC_LABEL"
    pattern: "(?i)(?:^|_|\b)(numero[_\\s]?(?:de[_\\s]?)?ruc|ruc[_\\s]?peru|registro[_\\s]?unico[_\\s]?(?:de[_\\s]?)?contribuyentes)\\w*"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — RUC)"

  - name: "PE_FIELD_PASSPORT_LABEL"
    pattern: "(?i)(?:^|_|\b)(pasaporte[_\\s]?peru|numero[_\\s]?pasaporte[_\\s]?pe|passport[_\\s]?pe|pe[_\\s]?passport)\\w*"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — pasaporte)"

  - name: "PE_FIELD_CE_LABEL"
    pattern: "(?i)(?:^|_|\b)(carnet[_\\s]?(?:de[_\\s]?)?extranjer\\w*|ce[_\\s]?peru|carne[_\\s]?extranjer\\w*)"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — carnet de extranjería)"

  - name: "PE_FIELD_HEALTH_LABEL"
    pattern: "(?i)(?:^|_|\b)(historia[_\\s]?clinica|expediente[_\\s]?medico|datos[_\\s]?salud|eps[_\\s]?afiliacion|afiliado[_\\s]?essalud|sis[_\\s]?beneficiario)\\w*"
    norm_tag: "Ley 29733 Art. 2.5 (dato sensible — salud)"

  - name: "PE_FIELD_INCOME_LABEL"
    pattern: "(?i)(?:^|_|\b)(ingresos[_\\s]?economicos|situacion[_\\s]?economica|renta[_\\s]?anual)\\w*"
    norm_tag: "Ley 29733 Art. 2.5 (dato sensible — ingresos económicos)"

  - name: "PE_FIELD_CONVICTION_LABEL"
    pattern: "(?i)(?:^|_|\b)(ideologia|opinion[_\\s]?politica|conviccion[_\\s]?(?:religiosa|filosofica|moral)|afiliacion[_\\s]?sindical)\\w*"
    norm_tag: "Ley 29733 Art. 2.5 (dato sensible — convicciones)"

  - name: "PE_FIELD_MINOR_LABEL"
    pattern: "(?i)(?:^|_|\b)(datos[_\\s]?menores|datos[_\\s]?ninos|consentimiento[_\\s]?parental|menor[_\\s]?(?:de[_\\s]?)?edad)\\w*"
    norm_tag: "Ley 29733 Art. 13.3 (datos de NNA)"

  - name: "PE_FIELD_CONFIDENTIALITY_LABEL"
    pattern: "(?i)(?:^|_|\b)(comunicacion[_\\s]?confidencial|datos[_\\s]?confidenciales|secreto[_\\s]?profesional)\\w*"
    norm_tag: "Ley 29733 Art. 17 (deber de confidencialidad)"

  - name: "PE_LEY29733_JSON_LAT_PRECISION"
    pattern: "(?i)[\"']lat[\"']\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\b"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — geolocalización)"

  - name: "PE_LEY29733_JSON_LNG_PRECISION"
    pattern: "(?i)[\"'](?:lng|lon)[\"']\\s*:\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}\\b"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — geolocalización)"

  - name: "PE_LEY29733_LOCATION_CSV_PAIR"
    pattern: "(?i)\\blocation\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\s*,\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}"
    norm_tag: "Ley 29733 Art. 2.4 (dato personal — geolocalización)"

