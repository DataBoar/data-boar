recommendation_overrides:
  - norm_tag_pattern: "Ley 29733 Art. 2.4 (dato personal — DNI)"
    base_legal: "Ley 29733 Art. 2.4 — a DNI identifies a natural person. Art. 13.5 governs consent when required. Art. 29/34 — inscripción of the banco de datos ante ANPDP when applicable. In force since 2011; reglamento DS 003-2013-JUS. Authority: ANPDP (Art. 32)."
    risk: "Peruvian DNI fields identify the data subject directly. Unauthorized exposure enables identity fraud."
    recommendation: "Minimize DNI storage. Verify a lawful basis. Encrypt and restrict access. Confirm whether the banco de datos must be inscribed before ANPDP. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, operations"

  - norm_tag_pattern: "Ley 29733 Art. 2.4 (dato personal — RUC)"
    base_legal: "Ley 29733 Art. 2.4 — an RUC can identify a natural person (type 10) or a legal entity (type 20). Treat as personal data when it relates to an identifiable individual. Art. 29/34 inscripción when applicable."
    risk: "RUC fields may identify a taxpayer who is a natural person."
    recommendation: "Confirm whether the RUC identifies a natural person. Minimize full RUC storage when a token suffices. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, finance, operations"

  - norm_tag_pattern: "Ley 29733 Art. 2.4 (dato personal — pasaporte)"
    base_legal: "Ley 29733 Art. 2.4 — a passport number identifies the data subject. Art. 13.5 governs consent when required."
    risk: "Passport numbers enable direct identification and raise identity-fraud risk when combined with other fields."
    recommendation: "Prefer a verification flag over retaining the full passport number. Encrypt and apply least privilege. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, HR operations"

  - norm_tag_pattern: "Ley 29733 Art. 2.4 (dato personal — carnet de extranjería)"
    base_legal: "Ley 29733 Art. 2.4 — a carnet de extranjería identifies a natural person. Art. 13.5 governs consent when required."
    risk: "Foreign-resident ID fields identify the data subject and can reveal migratory status in practice."
    recommendation: "Minimize storage. Apply least privilege. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, HR operations"

  - norm_tag_pattern: "Ley 29733 Art. 2.5 (dato sensible — salud)"
    base_legal: "Ley 29733 Art. 2.5 — health data is sensitive. Art. 13.6 requires written consent for sensitive-data processing (or a statutory public-interest exception). Art. 12 is the interpretive value of principles, not the consent rule."
    risk: "Health records are a statutory sensitive category. Unauthorized exposure can harm the data subject and trigger ANPDP scrutiny."
    recommendation: "Verify written consent or another Art. 13.6 ground. Encrypt at rest and in transit. Limit access. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Ley 29733 Art. 2.5 (dato sensible — ingresos económicos)"
    base_legal: "Ley 29733 Art. 2.5 lists ingresos económicos as sensitive personal data. Art. 13.6 requires written consent unless a statutory exception applies."
    risk: "Income and economic-situation fields are sensitive under Peruvian law — uncommon wording versus several other LatAm samples."
    recommendation: "Verify Art. 13.6 basis. Minimize retention. Restrict access. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, HR, finance"

  - norm_tag_pattern: "Ley 29733 Art. 2.5 (dato sensible — convicciones)"
    base_legal: "Ley 29733 Art. 2.5 — political, religious, philosophical or moral opinions/convictions and union affiliation are sensitive. Art. 13.6 written consent (or statutory exception)."
    risk: "Ideology / conviction / union columns are sensitive categories. Exposure can harm the data subject."
    recommendation: "Verify Art. 13.6 basis. Apply least privilege. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, HR"

  - norm_tag_pattern: "Ley 29733 Art. 13.3 (datos de NNA)"
    base_legal: "Ley 29733 Art. 13.3 — special measures for children's and adolescents' personal data are set by reglamento; rights are exercised via legal representatives."
    risk: "Column names indicate minors' data. This scanner does not perform age verification."
    recommendation: "Confirm representative-consent workflow and purpose limitation. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, product"

  - norm_tag_pattern: "Ley 29733 Art. 17 (deber de confidencialidad)"
    base_legal: "Ley 29733 Art. 17 — controllers, processors, and anyone involved in processing must keep personal data and their antecedents confidential (duty survives the relationship). This is not an Art. 2.5 category labelled comunicación confidencial. A complementary provision treats certain Ley 27806 Art. 17(5) confidential information as sensitive."
    risk: "Columns labelled confidential communications or professional secrecy may hold personal data subject to the Art. 17 duty."
    recommendation: "Apply need-to-know access and retention limits. Confirm whether Ley 27806 confidential-information rules also apply. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Ley 29733 Art. 2.4 (dato personal — geolocalización)"
    base_legal: "Ley 29733 Art. 2.4 — precise geolocation can identify or make identifiable a natural person. Art. 13.5 governs consent when required."
    risk: "Precise coordinates can track the data subject."
    recommendation: "Minimize stored location precision. Review retention. Consult counsel. Heuristic inventory — not a legal conclusion."
    priority: "MÉDIA"
    relevant_for: "DPO, product, legal"
