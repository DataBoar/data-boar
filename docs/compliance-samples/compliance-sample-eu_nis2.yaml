# EU NIS2 Directive (Directive 2022/2555) — Network and Information Security
# Directive in force: 2023 (EU publication).
# Transposition deadline: 17/10/2024; application depends on national transposition.
#
# NOT LEGAL ADVICE. Technical starting point for inventory of data fields
# relevant to NIS2 cybersecurity incident reporting and supply-chain risk.
# NIS2 is a cybersecurity directive — not a personal data protection law.
# It complements GDPR: security incidents under NIS2 often trigger GDPR
# breach notifications. Use alongside compliance-sample-eu_gdpr.yaml.
#
# Authority: ENISA (EU Agency for Cybersecurity) + national CSIRTs / CAs
# Reference: Directive 2022/2555/EU — eur-lex.europa.eu
#
# Who is in scope: Essential Entities (EE) and Important Entities (IE):
# energy, transport, banking, financial market infrastructure, health,
# drinking water, wastewater, digital infrastructure, ICT service management,
# public administration, space sector, and additional IE sectors.
#
# NOTE — recommendation_overrides use distinctive Art. N (role) patterns.
# Do not add a bare "NIS2" catch-all: _find_override_row is bidirectional
# substring match and would steal every NIS2 row (and any future tag).
# Keep "NIS2 Art. 21 (access control — MFA)" before "NIS2 Art. 21 (access control)".
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-eu_nis2.yaml
#   ml_patterns_file:     path/to/compliance-sample-eu_nis2.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.
#   Pair with: compliance-sample-eu_gdpr.yaml for full EU coverage.

regex:
  - name: "NIS2_INCIDENT_ID_FIELD"
    # CSIRT/CERT contact columns are Art. 23 incident-response metadata, not Art. 3 EE class.
    pattern: "(?i)\\b(incident[_\\s]?id|event[_\\s]?id|security[_\\s]?event|cyber[_\\s]?incident|breach[_\\s]?id|nis2[_\\s]?report|csirt[_\\s]?ref|csirt[_\\s]?contact|cert[_\\s]?contact)\\b"
    norm_tag: "NIS2 Art. 23 (incident notification)"

  - name: "NIS2_VULNERABILITY_FIELD"
    pattern: "(?i)\\b(vulnerability[_\\s]?id|cve[_\\s]?id|cwe[_\\s]?id|vuln[_\\s]?ref|patch[_\\s]?status|zero[_\\s]?day|exploit[_\\s]?code)\\b"
    norm_tag: "NIS2 Art. 12 (vulnerability disclosure)"

  - name: "NIS2_SUPPLY_CHAIN_FIELD"
    pattern: "(?i)\\b(supplier[_\\s]?risk|vendor[_\\s]?assessment|third[_\\s]?party[_\\s]?security|supply[_\\s]?chain[_\\s]?risk|ictsm[_\\s]?assessment)\\b"
    norm_tag: "NIS2 Art. 21 (supply chain security)"

  - name: "NIS2_CRITICAL_INFRA_FIELD"
    pattern: "(?i)\\b(critical[_\\s]?infrastructure|essential[_\\s]?service|oe[_\\s]?service|nis2[_\\s]?entity)\\b"
    norm_tag: "NIS2 Art. 3 (essential entity)"

  - name: "NIS2_NETWORK_CREDENTIAL"
    pattern: "(?i)\\b(network[_\\s]?password|system[_\\s]?credential|admin[_\\s]?password|root[_\\s]?password|service[_\\s]?account[_\\s]?password)\\b"
    norm_tag: "NIS2 Art. 21 (access control)"

  - name: "NIS2_MFA_FIELD"
    pattern: "(?i)\\b(mfa[_\\s]?secret|totp[_\\s]?seed|authenticator[_\\s]?key|otp[_\\s]?secret|2fa[_\\s]?token|multi[_\\s]?factor[_\\s]?seed)\\b"
    norm_tag: "NIS2 Art. 21 (access control — MFA)"

  - name: "NIS2_ENCRYPTION_KEY_FIELD"
    pattern: "(?i)\\b(encryption[_\\s]?key|private[_\\s]?key|secret[_\\s]?key|signing[_\\s]?key|api[_\\s]?secret|client[_\\s]?secret)\\b"
    norm_tag: "NIS2 Art. 21 (cryptographic measures)"

