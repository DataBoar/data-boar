recommendation_overrides:
  - norm_tag_pattern: "NIS2 Art. 23 (incident notification)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 23 — significant incidents must be notified to competent authority/CSIRT within 24 hours (early warning) and 72 hours (incident notification). Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "Field contains incident identification or reporting data. NIS2 mandates timely notification to national CSIRT or competent authority. Failure to notify within timelines may result in supervisory action."
    recommendation: "CSIRT/CERT contact columns are incident-response contacts (Art. 23), not Essential Entity classification (Art. 3). Keep incident IDs and CSIRT contacts access-controlled and retained for audit. Verify the 24h/72h/1-month notification workflow is documented and tested. Engage CISO and legal counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "CISO, DPO, legal, incident response team, competent authority liaison"

  - norm_tag_pattern: "NIS2 Art. 21 (access control — MFA)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 21(2)(j) — multi-factor authentication and continuous authentication solutions required for essential/important entities. Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "MFA seed, TOTP key, or authenticator secret found in data store. These should never be stored in plaintext databases or scanned filesystems — they are equivalent to credentials."
    recommendation: "Immediately review storage of MFA secrets. Use dedicated secrets management (HSM, vault). Rotate any exposed secrets. NIS2 Art. 21 requires MFA for privileged access. Consult CISO and security team."
    priority: "CRÍTICA"
    relevant_for: "CISO, security engineering, DPO"

  - norm_tag_pattern: "NIS2 Art. 21 (cryptographic measures)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 21(2)(h) — cryptography and encryption policies required. Plaintext cryptographic keys in databases/files represent a critical exposure. Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "Encryption key or private key found in scanned data. Plaintext storage of cryptographic material is a critical security control failure under NIS2 Art. 21(2)(h)."
    recommendation: "Immediately rotate any exposed keys. Move all cryptographic material to dedicated secrets management (HSM, KMS, vault). Review key storage policy. Escalate to CISO. This is a critical finding regardless of NIS2 scope."
    priority: "CRÍTICA"
    relevant_for: "CISO, security engineering, DevSecOps"

  - norm_tag_pattern: "NIS2 Art. 21 (access control)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 21(2)(i) — access control policies and secure development required for essential/important entities. Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "System credential, admin password, or privileged account data found in scanned store. This represents a critical access control exposure under NIS2 Art. 21(2)(i)."
    recommendation: "Rotate exposed credentials immediately. Implement PAM (privileged access management). Verify no credentials are stored in application databases, config files, or logs. Review access control policies per NIS2 Art. 21. Consult CISO."
    priority: "CRÍTICA"
    relevant_for: "CISO, security engineering, IT operations"

  - norm_tag_pattern: "NIS2 Art. 21 (supply chain security)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 21(2)(d) — supply chain security including relationships with direct suppliers and service providers. Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "Supply chain risk assessment or vendor security data found. NIS2 requires formal supply chain security policies covering ICT service providers and managed service providers."
    recommendation: "Review vendor/supplier security assessment data for appropriate access controls and retention. Ensure third-party agreements include NIS2-compliant security requirements. Consult CISO and legal. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "CISO, procurement, legal, vendor management"

  - norm_tag_pattern: "NIS2 Art. 12 (vulnerability disclosure)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 12 — coordinated vulnerability disclosure policy. ENISA maintains the EUVD (EU Vulnerability Database). Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "Vulnerability ID, CVE, or exploit code found in scanned data. These may indicate unpatched vulnerabilities or active exploitation data that requires responsible disclosure."
    recommendation: "Ensure vulnerability data is access-controlled and shared only through coordinated disclosure channels (CSIRT, ENISA EUVD). Verify patch management status for found CVEs. Consult CISO and incident response team."
    priority: "ALTA"
    relevant_for: "CISO, security engineering, incident response, competent authority"

  - norm_tag_pattern: "NIS2 Art. 3 (essential entity)"
    base_legal: "EU NIS2 Directive 2022/2555 Art. 3 — essential entities (energy, transport, banking, health, digital infrastructure, etc.) have heightened obligations. Transposition deadline: 17/10/2024; application depends on national transposition."
    risk: "Data field references essential entity classification or critical service. Essential entities are subject to stricter security measures, supervisory oversight, and notification obligations under NIS2."
    recommendation: "Verify whether your organisation is classified as an Essential Entity under NIS2 and confirm compliance with Art. 21 security measures and Art. 23 notification obligations. Consult CISO and legal counsel."
    priority: "MÉDIA"
    relevant_for: "CISO, DPO, legal, board / executive team"
