recommendation_overrides:
  - norm_tag_pattern: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — CNIC)"
    base_legal: "Pakistan Personal Data Protection Bill 2023 (May 2023 draft) s.2(kk)(iii) — CNIC is listed as sensitive personal data. s.15 governs processing. Draft only — not yet enacted as of 2026-08. Proposed authority: NCPDP (s.35)."
    risk: "CNIC identifies a natural person and is treated as sensitive in the draft. Exposure enables identity fraud. Do not treat this tag as current statute."
    recommendation: "Minimize CNIC storage. Verify any processing basis against the draft s.15 and current PECA/PKCERT practice. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, operations"

  - norm_tag_pattern: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — passport)"
    base_legal: "Pakistan Personal Data Protection Bill 2023 s.2(kk)(iii) — passport is listed as sensitive personal data. Draft only — not yet enacted as of 2026-08."
    risk: "Passport numbers identify the data subject. Combined with other fields they raise identity-fraud risk."
    recommendation: "Prefer a verification flag over retaining the full passport number. Encrypt and apply least privilege. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, HR operations"

  - norm_tag_pattern: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — health)"
    base_legal: "Pakistan Personal Data Protection Bill 2023 s.2(kk)(ii) — health data is sensitive. s.15 requires explicit consent or a listed exception. Draft only — not yet enacted as of 2026-08."
    risk: "Health records are a draft sensitive category. Unauthorized exposure can harm the data subject and trigger future NCPDP scrutiny if the Bill is enacted."
    recommendation: "Verify explicit consent or another s.15 ground. Encrypt at rest and in transit. Limit access. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Pakistan PDPA Bill 2023 s.14 (children's data)"
    base_legal: "Pakistan Personal Data Protection Bill 2023 s.14 — child means under 18; parental/relevant-person consent; no tracking, behavioural monitoring, or targeted advertising directed at children. Draft only — not yet enacted as of 2026-08."
    risk: "Column names indicate children's data. The draft requires age verification and parental consent; this scanner does not perform either."
    recommendation: "Confirm parental-consent workflow and purpose limitation. This does not certify age checks. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, product"

  - norm_tag_pattern: "Pakistan PDPA Bill 2023 s.2 (personal data — NTN)"
    base_legal: "Pakistan Personal Data Protection Bill 2023 s.2(z) — an NTN can identify a natural person. Not listed as sensitive under s.2(kk) (financial data excludes identification numbers). Draft only — not yet enacted as of 2026-08."
    risk: "NTN fields may identify a taxpayer. Treat as personal data when they relate to an identifiable individual."
    recommendation: "Minimize full NTN storage when a token suffices. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, finance"

  - norm_tag_pattern: "Pakistan PDPA Bill 2023 s.2 (personal data — geolocation)"
    base_legal: "Pakistan Personal Data Protection Bill 2023 s.2(z) — precise geolocation can identify or make identifiable a natural person. Draft only — not yet enacted as of 2026-08."
    risk: "Precise coordinates can track the data subject."
    recommendation: "Minimize stored location precision. Review retention. Consult counsel. Heuristic inventory — not a legal conclusion."
    priority: "MÉDIA"
    relevant_for: "DPO, product, legal"
