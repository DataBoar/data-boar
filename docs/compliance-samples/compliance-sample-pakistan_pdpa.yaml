# Pakistan — Personal Data Protection Bill 2023 (PDPB / draft PDPA)
# Draft published May 2023. As of 2026-08 this is a BILL, not an enacted Act
# (Chambers Data Protection & Privacy 2026; DLA Piper Data Protection Laws of
# the World). Do NOT treat tags as "in force" law. Revalidate before relying.
#
# NOT LEGAL ADVICE. Technical starting point for inventory of personal-data
# fields that the draft would cover if enacted. Does NOT certify compliance.
#
# Proposed authority: National Commission for Personal Data Protection (NCPDP)
# — Bill s.35 (to be established after commencement). Until then, PECA 2016
# identity-information rules and PKCERT advisories may still apply in practice.
#
# Pair with: compliance-sample-india_dpdp.yaml for South Asia deployments.
#
# Key draft citations (May 2023 text):
#   s.2(z)   personal data
#   s.2(kk)  sensitive personal data — includes CNIC or passport, health,
#            biometric, genetic, religious beliefs, criminal records, political
#            affiliations, caste/tribe, ethnicity, and certain financial data
#   s.14     children's data (under 18; parental consent; no tracking / ads)
#   s.15     processing of sensitive and critical personal data
#   s.35     NCPDP
#
# Identifiers use contextual column labels plus the distinctive formatted CNIC
# (XXXXX-XXXXXXX-X). No bare 13-digit matcher (high FP). No querystring
# geo-coordinate key used in older samples (PII seed gate).
#
# NOTE — recommendation_overrides use distinctive s.N (role) patterns.
# Do not add a bare "Pakistan PDPA" catch-all: _find_override_row is bidirectional.
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-pakistan_pdpa.yaml
#   ml_patterns_file:     path/to/compliance-sample-pakistan_pdpa.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.

regex:
  - name: "PK_CNIC_FORMATTED"
    # NADRA CNIC printed form XXXXX-XXXXXXX-X — heuristic only, no checksum.
    pattern: "\\b\\d{5}-\\d{7}-\\d\\b"
    norm_tag: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — CNIC)"

  - name: "PK_FIELD_CNIC_LABEL"
    pattern: "(?i)(?:^|_|\b)(cnic|nadra[_\\s]?(?:number|id|no)|national[_\\s]?identity[_\\s]?card|computerised[_\\s]?national[_\\s]?identity)\\w*"
    norm_tag: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — CNIC)"

  - name: "PK_FIELD_NTN_LABEL"
    pattern: "(?i)(?:^|_|\b)(ntn[_\\s]?(?:number|no)?|national[_\\s]?tax[_\\s]?number|fbr[_\\s]?ntn)\\w*"
    norm_tag: "Pakistan PDPA Bill 2023 s.2 (personal data — NTN)"

  - name: "PK_FIELD_PASSPORT_LABEL"
    pattern: "(?i)(?:^|_|\b)(pakistan[_\\s]?passport|pk[_\\s]?passport|passport[_\\s]?pk)\\w*"
    norm_tag: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — passport)"

  - name: "PK_FIELD_HEALTH_LABEL"
    pattern: "(?i)(?:^|_|\b)(health[_\\s]?data|medical[_\\s]?(?:record|information)|patient[_\\s]?record)\\w*"
    norm_tag: "Pakistan PDPA Bill 2023 s.2(kk) (sensitive — health)"

  - name: "PK_FIELD_CHILD_LABEL"
    pattern: "(?i)(?:^|_|\b)(child(?:ren)?[_\\s]?data|parental[_\\s]?consent|minor[_\\s]?(?:under[_\\s]?)?18)\\w*"
    norm_tag: "Pakistan PDPA Bill 2023 s.14 (children's data)"

  - name: "PK_PDPA_JSON_LAT_PRECISION"
    pattern: "(?i)[\"']lat[\"']\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\b"
    norm_tag: "Pakistan PDPA Bill 2023 s.2 (personal data — geolocation)"

  - name: "PK_PDPA_JSON_LNG_PRECISION"
    pattern: "(?i)[\"'](?:lng|lon)[\"']\\s*:\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}\\b"
    norm_tag: "Pakistan PDPA Bill 2023 s.2 (personal data — geolocation)"

  - name: "PK_PDPA_LOCATION_CSV_PAIR"
    pattern: "(?i)\\blocation\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\s*,\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}"
    norm_tag: "Pakistan PDPA Bill 2023 s.2 (personal data — geolocation)"

