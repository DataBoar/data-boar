recommendation_overrides:
  - norm_tag_pattern: "LOPDP Art. 23 (dato sensible — salud)"
    base_legal: "LOPDP Ecuador Art. 23 — health data is a sensitive category; processing requires express consent or a qualified legal basis. Full enforcement since 26 May 2023. Authority: APDP."
    risk: "Health data classified as sensitive under Art. 23. Requires a qualified legal basis and stronger security measures. A breach may trigger APDP sanctions and notification duties."
    recommendation: "Verify legal basis (express consent or Art. 23 exception). Encrypt at rest and in transit. Limit access. Notify APDP of breaches (Art. 42 — 72 hours). Consult DPO and legal counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, APDP compliance"

  - norm_tag_pattern: "LOPDP Art. 23 (dato sensible — migratorio)"
    base_legal: "LOPDP Ecuador Art. 23 — migratory status is a sensitive category under LOPDP (Ecuador-specific). Full enforcement since 26 May 2023. Authority: APDP."
    risk: "Migratory status is a sensitive category under LOPDP — unusual among LatAm frameworks. Processing typically needs express consent. Exposure can seriously harm the data subject."
    recommendation: "Verify legal basis for processing migratory status. Apply least-privilege access. Review retention. Consult DPO and legal counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, human resources"

  - norm_tag_pattern: "LOPDP Art. 35 (datos de niñas, niños y adolescentes)"
    base_legal: "LOPDP Ecuador Art. 35 — processing of children's and adolescents' data requires parental or guardian consent and heightened protection. Full enforcement since 26 May 2023. Authority: APDP."
    risk: "Column names indicate children's or minors' data. LOPDP Art. 35 requires additional safeguards beyond ordinary personal data."
    recommendation: "Confirm parental/guardian consent workflow and purpose limitation. Minimize retention. Pair with Colombia/Chile samples only for inventory — this does not certify age verification. Consult DPO. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, product, education / HR operations"

  - norm_tag_pattern: "LOPDP Art. 26 (dato personal — cédula)"
    base_legal: "LOPDP Ecuador Art. 26 — cédula de identidad is personal data that enables direct identification. Full enforcement since 26 May 2023. Authority: APDP."
    risk: "Ecuadorian cédula fields identify the data subject directly. Unauthorized exposure can enable identity fraud and phishing."
    recommendation: "Apply data minimization. Verify legal basis and purpose. Encrypt at rest. Restrict access. Notify APDP of breaches within 72 hours (Art. 42). Consult DPO. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, operations"

  - norm_tag_pattern: "LOPDP Art. 26 (dato personal — RUC)"
    base_legal: "LOPDP Ecuador Art. 26 — RUC can identify a natural person (cédula + establishment suffix) or a legal entity. Full enforcement since 26 May 2023. Authority: APDP."
    risk: "RUC fields may identify a natural person or link a person to a tax registration. Treat as personal data when they relate to an identifiable individual."
    recommendation: "Confirm whether the RUC identifies a natural person. Minimize storage of full RUC when a token or last-four suffices. Consult DPO. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, finance, operations"

  - norm_tag_pattern: "LOPDP Art. 26 (dato personal — pasaporte)"
    base_legal: "LOPDP Ecuador Art. 26 — passport numbers identify the data subject directly. Full enforcement since 26 May 2023. Authority: APDP."
    risk: "Passport numbers enable direct identification. Combined with other fields, they raise identity-fraud risk."
    recommendation: "Verify whether retaining the passport number is necessary versus a verification flag. Encrypt and apply least privilege. Consult DPO. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, HR operations"

  - norm_tag_pattern: "LOPDP Art. 26 (dato personal — geolocalización)"
    base_legal: "LOPDP Ecuador Art. 26 — precise geolocation is personal data under LOPDP. Full enforcement since 26 May 2023."
    risk: "Precise geolocation can track the data subject. Processing without consent or another legal basis may violate LOPDP."
    recommendation: "Minimize stored location precision. Verify consent or another legal basis. Review retention. Consult DPO and legal counsel. Heuristic inventory — not a legal conclusion."
    priority: "MÉDIA"
    relevant_for: "DPO, product, legal"
