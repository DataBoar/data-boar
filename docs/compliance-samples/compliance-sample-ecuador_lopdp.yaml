# Ecuador — Ley Orgánica de Protección de Datos Personales (LOPDP)
# Approved: 26 May 2021; full enforcement: 26 May 2023 (2-year transition).
#
# NOT LEGAL ADVICE. Technical starting point for inventory of personal data
# fields in systems that may fall under Ecuador's LOPDP. Does NOT certify
# compliance or replace DPO analysis or legal counsel.
#
# Authority: Autoridad de Protección de Datos Personales (APDP) — Ecuador
# Reference: Registro Oficial N° 459 (26 May 2021)
#
# Key scope: organisations processing personal data of individuals located in
# Ecuador, or organisations located in Ecuador processing data abroad
# (extraterritorial reach). LOPDP is strongly GDPR-influenced.
#
# Key differentiator: Art. 23 lists migratory status as a sensitive category
# (unusual among LatAm frameworks). Identifiers (cédula, RUC, passport) use
# contextual column labels — not bare 10-digit matchers (high FP; same class
# as ISPB / nude CPF).
#
# Pair with: compliance-sample-colombia_1581.yaml,
# compliance-sample-chile_privacy.yaml, or compliance-sample-mexico_lfpdppp.yaml.
#
# NOTE — recommendation_overrides use distinctive Art. N (role) patterns.
# Do not add a bare "LOPDP" catch-all: _find_override_row is bidirectional
# substring match and would steal every LOPDP row.
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-ecuador_lopdp.yaml
#   ml_patterns_file:     path/to/compliance-sample-ecuador_lopdp.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.

regex:
  - name: "EC_FIELD_CEDULA_LABEL"
    pattern: "(?i)\\b(cedula[_\\s]?identidad|numero[_\\s]?cedula|ci[_\\s]?ecuador|cedula[_\\s]?ecuatoriana|cédula[_\\s]?identidad)\\b"
    norm_tag: "LOPDP Art. 26 (dato personal — cédula)"

  - name: "EC_FIELD_RUC_LABEL"
    pattern: "(?i)\\b(numero[_\\s]?ruc|ruc[_\\s]?ecuador|ruc[_\\s]?contribuyente|registro[_\\s]?unico[_\\s]?contribuyentes)\\b"
    norm_tag: "LOPDP Art. 26 (dato personal — RUC)"

  - name: "EC_FIELD_PASSPORT_LABEL"
    pattern: "(?i)\\b(pasaporte[_\\s]?ecuador|numero[_\\s]?pasaporte|passport[_\\s]?ec|ec[_\\s]?passport)\\b"
    norm_tag: "LOPDP Art. 26 (dato personal — pasaporte)"

  - name: "EC_FIELD_HEALTH_LABEL"
    pattern: "(?i)\\b(historia[_\\s]?clinica|expediente[_\\s]?medico|datos[_\\s]?salud|registro[_\\s]?medico|diagnostico[_\\s]?medico)\\b"
    norm_tag: "LOPDP Art. 23 (dato sensible — salud)"

  - name: "EC_FIELD_MIGRATION_LABEL"
    # Migratory status is a sensitive category in LOPDP — unusual among LatAm frameworks.
    pattern: "(?i)\\b(estatus[_\\s]?migratorio|condicion[_\\s]?migratoria|visa[_\\s]?tipo|permiso[_\\s]?residencia|status[_\\s]?migratorio)\\b"
    norm_tag: "LOPDP Art. 23 (dato sensible — migratorio)"

  - name: "EC_FIELD_MINOR_LABEL"
    pattern: "(?i)\\b(datos[_\\s]?menores|datos[_\\s]?ninos|consentimiento[_\\s]?parental|menor[_\\s]?edad)\\b"
    norm_tag: "LOPDP Art. 35 (datos de niñas, niños y adolescentes)"

  - name: "EC_LOPDP_JSON_LAT_PRECISION"
    pattern: "(?i)[\"']lat[\"']\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\b"
    norm_tag: "LOPDP Art. 26 (dato personal — geolocalización)"

  - name: "EC_LOPDP_JSON_LNG_PRECISION"
    pattern: "(?i)[\"'](?:lng|lon)[\"']\\s*:\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}\\b"
    norm_tag: "LOPDP Art. 26 (dato personal — geolocalización)"

  - name: "EC_LOPDP_LOCATION_CSV_PAIR"
    pattern: "(?i)\\blocation\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\s*,\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}"
    norm_tag: "LOPDP Art. 26 (dato personal — geolocalización)"

