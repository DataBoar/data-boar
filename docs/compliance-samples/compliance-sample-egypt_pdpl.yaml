recommendation_overrides:
  # Children's data before health: compound columns (e.g. guardian_consent_health_data)
  # join both norm_tags; _find_override_row is first-match.
  - norm_tag_pattern: "Egypt PDPL Law 151/2020 (sensitive — children's data)"
    base_legal: "Egypt PDPL + Decree 816/2025 — children's data is sensitive. Under 15: guardian written consent; 15+: child or guardian written consent. No tracking/profiling from children's games or competitions."
    risk: "Column names indicate children's data. This scanner does not perform age verification."
    recommendation: "Confirm guardian-consent workflow and purpose limitation. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, product"

  - norm_tag_pattern: "Egypt PDPL Law 151/2020 (sensitive — health)"
    base_legal: "Egypt PDPL Law 151/2020 + Decree 816/2025 — health / genetic data is sensitive. Licensing/permit from the Centre typically required before processing sensitive data. Grace period ends 31 Oct 2026."
    risk: "Health records are a statutory sensitive category. Unauthorized exposure can harm the data subject and trigger Centre scrutiny after enforcement."
    recommendation: "Verify a lawful basis and any required Centre permit. Encrypt at rest and in transit. Confirm DPO registration where applicable. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO"

  - norm_tag_pattern: "Egypt PDPL Law 151/2020 (electronic direct marketing)"
    base_legal: "Egypt PDPL + Decree 816/2025 — electronic direct marketing (EDM) generally needs prior consent and may need a specific Centre permit. Revalidate the current licence list."
    risk: "EDM columns may indicate marketing without a documented consent or permit trail."
    recommendation: "Confirm opt-in consent and whether an EDM permit is required. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, marketing"

  - norm_tag_pattern: "Egypt PDPL Law 151/2020 (personal data — national ID)"
    base_legal: "Egypt PDPL Law 151/2020 — a national ID (الرقم القومي) identifies a natural person. Controllers typically need a Centre licence before processing. Full enforcement expected 31 Oct 2026."
    risk: "Egyptian national-ID fields identify the data subject. A bare 14-digit matcher is intentionally omitted (high false-positive rate)."
    recommendation: "Minimize ID storage. Confirm licence/permit status with the Centre. Notify breaches to the Centre within 72 hours of awareness. Consult counsel. Not a legal conclusion."
    priority: "ALTA"
    relevant_for: "DPO, legal, CISO, operations"

  - norm_tag_pattern: "Egypt PDPL Law 151/2020 (personal data — geolocation)"
    base_legal: "Egypt PDPL Law 151/2020 — precise geolocation can identify or make identifiable a natural person. CCTV / visual monitoring may need a separate Centre permit."
    risk: "Precise coordinates can track the data subject."
    recommendation: "Minimize stored location precision. Review whether a visual-surveillance permit applies. Consult counsel. Heuristic inventory — not a legal conclusion."
    priority: "MÉDIA"
    relevant_for: "DPO, product, legal"
