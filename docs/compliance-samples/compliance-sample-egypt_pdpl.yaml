# Egypt — Personal Data Protection Law No. 151 of 2020 (PDPL)
# Executive Regulations: Minister of Communications and IT Decree No. 816/2025
# (issued 1 Nov 2025). One-year grace; full enforcement expected 31 Oct 2026.
# Revalidate Centre licensing-portal status before treating tags as "licensed".
#
# NOT LEGAL ADVICE. Technical starting point for inventory. Does NOT certify
# PDPC licensing, DPO registration, or cross-border approval.
#
# Authority: Personal Data Protection Centre (PDPC / the Centre), under MCIT.
# Controllers and processors typically need a licence or permit before
# processing; extra permits for sensitive data, cross-border transfer,
# CCTV, and electronic direct marketing (EDM). Processors outside Egypt
# may need a local representative — confirm current Regulations text.
#
# Sensitive / special categories (PDPL + Regulations summaries): mental,
# psychological, physical or genetic health; biometric; financial;
# religious beliefs; political opinions; criminal status. Children's data
# is treated as sensitive. Under 15: guardian written consent; 15+: child
# or guardian written consent. No tracking/profiling from children's
# games/competitions.
#
# Breach: notify the Centre within 72 hours of becoming aware (national-
# security cases: without delay). Affected individuals: commonly cited as
# three working days — revalidate the Regulations article.
#
# Identifiers use contextual column labels. No bare 14-digit national-ID
# matcher (high FP). No querystring geo-coordinate key (PII seed gate).
#
# Arabic terms below are everyday inventory vocabulary (بيانات شخصية,
# الرقم القومي). Not a certified legal glossary.
#
# Pair with: compliance-sample-uae_pdpl.yaml or compliance-sample-saudi_pdpl.yaml.
#
# NOTE — recommendation_overrides use distinctive Law 151 (role) patterns.
# Do not add a bare "Egypt PDPL" catch-all: _find_override_row is bidirectional.
#
# How to use:
#   regex_overrides_file: path/to/compliance-sample-egypt_pdpl.yaml
#   ml_patterns_file:     path/to/compliance-sample-egypt_pdpl.yaml
#   Merge recommendation_overrides into report.recommendation_overrides.

regex:
  - name: "EG_FIELD_NATIONAL_ID_LABEL"
    pattern: "(?i)(?:^|_|\b)(national[_\\s]?id[_\\s]?(?:eg|egypt)?|egyptian[_\\s]?(?:national[_\\s]?)?id|raqm[_\\s]?qawmi|qawmi[_\\s]?(?:number|id)|numero[_\\s]?nacional[_\\s]?eg)\\w*"
    norm_tag: "Egypt PDPL Law 151/2020 (personal data — national ID)"

  - name: "EG_FIELD_HEALTH_LABEL"
    pattern: "(?i)(?:^|_|\b)(health[_\\s]?data[_\\s]?eg|medical[_\\s]?(?:record|information)[_\\s]?eg|patient[_\\s]?record[_\\s]?eg|datos[_\\s]?salud[_\\s]?eg)\\w*"
    norm_tag: "Egypt PDPL Law 151/2020 (sensitive — health)"

  - name: "EG_FIELD_HEALTH_GENERIC_LABEL"
    pattern: "(?i)(?:^|_|\b)(historia[_\\s]?clinica|medical[_\\s]?record|patient[_\\s]?record|health[_\\s]?data)\\w*"
    norm_tag: "Egypt PDPL Law 151/2020 (sensitive — health)"

  - name: "EG_FIELD_CHILD_LABEL"
    pattern: "(?i)(?:^|_|\b)(child(?:ren)?[_\\s]?data|guardian[_\\s]?consent|menor[_\\s]?(?:de[_\\s]?)?15|child[_\\s]?under[_\\s]?15)\\w*"
    norm_tag: "Egypt PDPL Law 151/2020 (sensitive — children's data)"

  - name: "EG_FIELD_EDM_LABEL"
    pattern: "(?i)(?:^|_|\b)(electronic[_\\s]?direct[_\\s]?marketing|edm[_\\s]?consent|direct[_\\s]?marketing[_\\s]?eg)\\w*"
    norm_tag: "Egypt PDPL Law 151/2020 (electronic direct marketing)"

  - name: "EG_PDPL_JSON_LAT_PRECISION"
    pattern: "(?i)[\"']lat[\"']\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\b"
    norm_tag: "Egypt PDPL Law 151/2020 (personal data — geolocation)"

  - name: "EG_PDPL_JSON_LNG_PRECISION"
    pattern: "(?i)[\"'](?:lng|lon)[\"']\\s*:\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}\\b"
    norm_tag: "Egypt PDPL Law 151/2020 (personal data — geolocation)"

  - name: "EG_PDPL_LOCATION_CSV_PAIR"
    pattern: "(?i)\\blocation\\s*:\\s*[-+]?(?:[1-8]?\\d|90)\\.\\d{4,}\\s*,\\s*[-+]?(?:180|1[0-7]\\d|[1-9]?\\d)\\.\\d{4,}"
    norm_tag: "Egypt PDPL Law 151/2020 (personal data — geolocation)"

